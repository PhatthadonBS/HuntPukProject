<ion-header class="ion-no-border">
  <ion-toolbar class="custom-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" color="dark"></ion-back-button>
    </ion-buttons>
    <ion-title>ร้องขอเป็นเจ้าของหอพัก</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="main-container">
    
    <div class="form-card" *ngIf="!isSuccess">
      
      <div class="upload-section">
        <input type="file" #fileInput (change)="onFileSelected($event)" accept="image/*" style="display: none;">
        
        <div class="upload-box" (click)="fileInput.click()" 
             [class.has-image]="previewImage" 
             [class.error-border]="isSubmitted && !selectedFile">
             
          <img *ngIf="previewImage" [src]="previewImage" alt="Profile">
          
          <div class="upload-placeholder" *ngIf="!previewImage">
            <ion-icon name="cloud-upload-outline"></ion-icon>
            <span class="main-text">แตะเพื่ออัปโหลดรูป</span>
            <span class="sub-text">(* จำเป็น)</span>
          </div>

          <div class="edit-badge" *ngIf="previewImage">
            <ion-icon name="camera"></ion-icon>
          </div>
        </div>
      </div>

      <div class="error-banner" *ngIf="errorMessage">
        <ion-icon name="alert-circle"></ion-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <form (ngSubmit)="onSubmit()">
        
        <div class="input-group">
          <label>ชื่อ <span class="req">*</span></label>
          <div class="input-wrapper" [class.error-border]="isSubmitted && !formData.first_name">
            <ion-input [(ngModel)]="formData.first_name" name="first_name" type="text" placeholder="ชื่อจริง"></ion-input>
            <ion-icon name="person-outline"></ion-icon>
          </div>
        </div>

        <div class="input-group">
          <label>นามสกุล <span class="req">*</span></label>
          <div class="input-wrapper" [class.error-border]="isSubmitted && !formData.last_name">
            <ion-input [(ngModel)]="formData.last_name" name="last_name" type="text" placeholder="นามสกุล"></ion-input>
            <ion-icon name="person-outline"></ion-icon>
          </div>
        </div>

        <div class="input-group">
          <label>เบอร์โทร <span class="req">*</span></label>
          <div class="input-wrapper" [class.error-border]="isSubmitted && !formData.phone_number">
            <ion-input [(ngModel)]="formData.phone_number" name="phone_number" type="tel" maxlength="10" placeholder="0xxxxxxxxx" (keypress)="($event.charCode >= 48 && $event.charCode <= 57) ? true : $event.preventDefault()"></ion-input>
            <ion-icon name="call-outline"></ion-icon>
          </div>
        </div>

        <div class="divider">ช่องทางติดต่อเพิ่มเติม (ถ้ามี)</div>

        <div class="dual-inputs">
           <div class="input-group">
             <div class="input-wrapper social-input">
               <ion-icon name="logo-facebook" class="fb-color"></ion-icon>
               <ion-input [(ngModel)]="formData.facebook" name="facebook" placeholder="Facebook URL"></ion-input>
             </div>
           </div>
           
           <div class="input-group">
             <div class="input-wrapper social-input">
               <ion-icon name="chatbubbles" class="line-color"></ion-icon>
               <ion-input [(ngModel)]="formData.line" name="line" placeholder="Line ID / URL"></ion-input>
             </div>
           </div>
        </div>

        <div class="dual-inputs">
           <div class="input-group">
             <div class="input-wrapper social-input">
               <ion-icon name="logo-instagram" class="ig-color"></ion-icon>
               <ion-input [(ngModel)]="formData.instagram" name="instagram" placeholder="Instagram URL"></ion-input>
             </div>
           </div>

           <div class="input-group">
             <div class="input-wrapper social-input">
               <ion-icon name="logo-twitter" class="x-color"></ion-icon>
               <ion-input [(ngModel)]="formData.x" name="x" placeholder="X (Twitter) URL"></ion-input>
             </div>
           </div>
        </div>

        <div class="input-group">
           <div class="input-wrapper social-input">
             <ion-icon name="paper-plane" class="tg-color"></ion-icon>
             <ion-input [(ngModel)]="formData.telegram" name="telegram" placeholder="Telegram URL"></ion-input>
           </div>
        </div>

<div class="btn-container">
          <button type="button" class="btn cancel" (click)="onCancel()" [disabled]="isSubmitting">ยกเลิก</button>
          
          <button type="submit" class="btn confirm" [disabled]="isSubmitting">
            <span *ngIf="!isSubmitting">ยืนยันการขอสิทธิ์</span>
            <ion-spinner name="crescent" *ngIf="isSubmitting" style="width: 22px; height: 22px; margin-top: 5px;"></ion-spinner>
          </button>
        </div>

      </form>
    </div>

    <div class="success-card" *ngIf="isSuccess">
      <div class="success-icon">
        <ion-icon name="checkmark-circle"></ion-icon>
      </div>
      <h2>ส่งคำขอเรียบร้อย!</h2>
      <div class="status-text">
        <ion-icon name="time"></ion-icon> รอการตรวจสอบ
      </div>
      <p class="desc">
        ข้อมูลของคุณถูกส่งไปยังผู้ดูแลระบบแล้ว<br>
        กรุณารอการอนุมัติทางอีเมล
      </p>
      <button class="btn back-home" (click)="onCancel()">กลับหน้าหลัก</button>
    </div>

  </div>
</ion-content>
