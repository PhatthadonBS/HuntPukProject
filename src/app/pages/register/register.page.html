<ion-content [fullscreen]="true">
  
  <div class="register-container">
    
    <div class="back-button" (click)="goBack()">
  <ion-icon name="arrow-back"></ion-icon>
  <span>กลับ</span>
</div>

    <div class="form-section">
      
      <div class="custom-input">
        <input type="text" placeholder="ชื่อผู้ใช้" [(ngModel)]="username">
        <ion-icon name="person" color="medium"></ion-icon>
      </div>

      <div class="custom-input">
        <input type="email" placeholder="อีเมล" [(ngModel)]="email">
        <ion-icon name="person" color="medium"></ion-icon>
      </div>

      <div class="custom-input">
        <input type="password" placeholder="รหัสผ่าน" [(ngModel)]="password">
        <ion-icon name="key" color="medium"></ion-icon>
      </div>

      <div class="custom-input">
        <input type="password" placeholder="รหัสผ่านอีกครั้ง" [(ngModel)]="confirmPassword">
        <ion-icon name="key" color="medium"></ion-icon>
      </div>

      <div class="custom-input">
        <input type="tel" placeholder="เบอร์โทรศัพท์" [(ngModel)]="phone">
        <ion-icon name="call" color="medium"></ion-icon>
      </div>

    </div>

    <ion-button 
      expand="block" 
      shape="round" 
      class="btn-register" 
      (click)="register()">
      สมัครสมาชิก
    </ion-button>

  </div>

</ion-content>
