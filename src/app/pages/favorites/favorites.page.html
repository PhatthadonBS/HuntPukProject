<ion-content [fullscreen]="true">
  <div class="main-bg">
    
    <div class="top-bar">
      <div class="menu-btn" (click)="goBack()">
        <ion-icon name="arrow-back"></ion-icon>
      </div>
      <h2>รายการโปรดของฉัน</h2>
    </div>

    <div class="yellow-container">
      
      <div class="dorm-grid" *ngIf="favDorms.length > 0; else noData">
        
        <div class="dorm-card" *ngFor="let dorm of favDorms" (click)="goToDetail(dorm)">
          
          <div class="delete-btn" (click)="removeFavorite($event, dorm)">
             <ion-icon name="trash-outline"></ion-icon>
          </div>

          <div class="card-content">
            <div class="img-box">
              <ion-icon name="home" class="placeholder-icon" *ngIf="!dorm.image"></ion-icon>
              <img [src]="dorm.image" *ngIf="dorm.image" onerror="this.onerror=null; this.src='assets/dorm-placeholder.jpg'" />
            </div>

            <div class="info-box">
              <h3>{{ dorm.DORM_NAME }}</h3>
              
              <p class="zone-name" *ngIf="dorm.zone || dorm.ZONE_NAME">
                <ion-icon name="location-outline"></ion-icon> {{ dorm.zone || dorm.ZONE_NAME }}
              </p>
              <p class="desc">{{ dorm.ADDRESS }}</p>
              
              <div class="score-row" *ngIf="dorm.SCORE">
                 <ion-icon name="star" color="warning"></ion-icon>
                 <span>{{ dorm.SCORE }}</span>
              </div>

              <p class="price" *ngIf="dorm.start_price">เริ่มต้น {{ dorm.start_price | number }} บาท</p>
            </div>
          </div>

        </div>

      </div>

      <div class="loading-row" *ngIf="isLoading">
         <ion-spinner name="crescent"></ion-spinner>
      </div>

      <ng-template #noData>
        <div class="no-data" *ngIf="!isLoading">
          <ion-icon name="heart-dislike-outline"></ion-icon>
          <p>คุณยังไม่มีรายการโปรด</p>
        </div>
      </ng-template>

    </div>
  </div>
</ion-content>
