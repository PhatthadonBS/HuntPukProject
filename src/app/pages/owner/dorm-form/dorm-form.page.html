<div class="layout-container">

  <main class="main-body">

    <div class="scroll-content">
      <form [formGroup]="dormForm" (ngSubmit)="onSubmit()" class="form-grid">
        
        <div class="col-left">
          
          <div class="card">
            <div class="card-head">
               <span class="material-symbols-outlined">ข้อมูลทั่วไปของหอพัก</span>
            </div>
            <div class="form-group">
               <label>ชื่อหอพัก</label>
               <input type="text" formControlName="name" placeholder="ระบุชื่อหอพัก">
            </div>
            <div class="upload-row">
               <div class="up-box">
                  <label>รูปหน้าหอ</label>
                  <input type="file" (change)="onFileSelect($event, 'FRONT_DORM_IMG')">
               </div>
               <div class="up-box">
                  <label>ใบอนุญาตประกอบกิจการหอพัก</label>
                  <input type="file" (change)="onFileSelect($event, 'LICENSE_IMG')">
               </div>
            </div>
          </div>

          <div class="card">
             <div class="card-head">
                <span class="material-symbols-outlined">ตำแหน่งที่ตั้ง</span> 
             </div>
             <p class="hint">คลิกบนแผนที่เพื่อปักหมุด</p>
             <div class="map-box">
                <google-map height="100%" width="100%" [center]="center" [zoom]="zoom" (mapClick)="onMapClick($event)">
                   <map-marker *ngIf="markerPosition" [position]="markerPosition"></map-marker>
                </google-map>
             </div>
             <div class="form-group mt-2">
                <label>ที่อยู่ละเอียด</label>
                <textarea formControlName="address" rows="3"></textarea>
             </div>
          </div>

          <div class="card">
             <div class="card-head"><span class="material-symbols-outlined">สาธารณูปโภค</span> </div>
             <div class="row-group">
                <div class="form-group">
                   <label>ค่าน้ำ (บาท/หน่วย)</label>
                   <input type="number" formControlName="water_unit">
                </div>
                <div class="form-group">
                   <label>ค่าไฟ (บาท/หน่วย)</label>
                   <input type="number" formControlName="elect_unit">
                </div>
             </div>
          </div>

        </div>

        <div class="col-right">
           
           <div class="card highlight">
              <div class="card-head"><span class="material-symbols-outlined">bed</span> ประเภทห้องพัก</div>
              
              <div formArrayName="roomTypes" class="room-list">
                 <div *ngFor="let room of roomTypes.controls; let i=index" [formGroupName]="i" class="room-item">
                    <div class="room-top">
                       <span class="badge">ห้องที่ {{i+1}}</span>
                       <button type="button" class="del-btn" (click)="removeRoomType(i)" *ngIf="roomTypes.length>1">×</button>
                    </div>
                    <div class="row-group">
                       <div class="form-group">
                          <label>ชื่อห้อง</label>
                          <input type="text" formControlName="roomType" placeholder="เช่น VIP">
                       </div>
                       <div class="form-group">
                          <label>เตียง</label>
                          <select formControlName="bedType">
                             <option value="Single">เดี่ยว</option>
                             <option value="Double">คู่</option>
                          </select>
                       </div>
                    </div>
                    <div class="row-group">
                       <div class="form-group"><label>รายเดือน</label><input type="number" formControlName="perMonth"></div>
                       <div class="form-group"><label>รายเทอม</label><input type="number" formControlName="perTerm"></div>
                    </div>
                 </div>
              </div>
              <button type="button" class="add-btn" (click)="addRoomType()">+ เพิ่มห้อง</button>
           </div>

           <div class="card">
              <div class="card-head"><span class="material-symbols-outlined">photo_library</span> รูปภายใน</div>
              <div class="grid-upload">
                 <div class="tile"><label>เพดาน</label><input type="file" (change)="onFileSelect($event, 'CEILING_IMG')"></div>
                 <div class="tile"><label>ผนัง</label><input type="file" (change)="onFileSelect($event, 'WALL_IMG')"></div>
                 <div class="tile"><label>พื้น</label><input type="file" (change)="onFileSelect($event, 'FLOOR_IMG')"></div>
                 <div class="tile"><label>ห้องน้ำ</label><input type="file" (change)="onFileSelect($event, 'BATHROOM_IMG')"></div>
                 <div class="tile"><label>ระเบียง</label><input type="file" (change)="onFileSelect($event, 'BALCONY_IMG')"></div>
              </div>
           </div>

           <div class="card">
              <div class="card-head"><span class="material-symbols-outlined">imagesmode</span> รูปเพิ่มเติม</div>
              <div class="gallery-upload">
                 <span class="material-symbols-outlined icon-xl">cloud_upload</span>
                 <span>คลิกเพื่อเลือกหลายรูป</span>
                 <input type="file" multiple (change)="onFileSelect($event, 'OTHER_IMG', true)">
              </div>
           </div>

           <div class="actions">
              <button type="submit" class="save-btn">บันทึกข้อมูล</button>
           </div>
        </div>
      </form>
    </div>
  </main>
</div>
