<ion-header class="ion-no-border">
  <ion-toolbar class="custom-toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>บัญชีผู้ใช้</ion-title> </ion-toolbar>
</ion-header>

<ion-content>
  
  <div *ngIf="isLoading" class="loading-center">
     <ion-spinner name="crescent"></ion-spinner>
  </div>

  <div *ngIf="!isLoading && user" class="fade-in">

    <div class="profile-header-bg">
      <div class="avatar-wrapper">
        <div class="avatar-circle">
          <ion-icon name="person"></ion-icon> 
        </div>
        <div class="user-name-display">
          <h2>{{ user.username || 'Guest' }}</h2>
          <p>
            <span *ngIf="user.role_id === 1">สมาชิกทั่วไป</span>
            <span *ngIf="user.role_id === 2">เจ้าของหอพัก</span>
            <span *ngIf="user.role_id === 3">ผู้ดูแลระบบ</span>
          </p>
        </div>
      </div>
    </div>

    <div class="profile-content-card">
      
      <div class="edit-btn-wrapper" *ngIf="canEdit">
        <ion-button class="btn-edit-custom" expand="block" shape="round" (click)="goToEditProfile()">
          <ion-icon name="create" slot="start"></ion-icon>
          แก้ไขข้อมูลส่วนตัว
        </ion-button>
      </div>

      <div class="info-group">
        <div class="info-label">
          <div class="icon-box">
            <ion-icon name="person"></ion-icon>
          </div>
          <span>ชื่อผู้ใช้งาน</span>
        </div>
        <div class="info-value">
          {{ user.username || '-' }}
        </div>
      </div>

      <div class="divider"></div>

      <div class="info-group">
        <div class="info-label">
          <div class="icon-box">
            <ion-icon name="mail"></ion-icon>
          </div>
          <span>อีเมล</span>
        </div>
        <div class="info-value">
          {{ user.email || '-' }}
        </div>
      </div>

      <div class="divider"></div>

      <div class="info-group">
        <div class="info-label">
          <div class="icon-box">
            <ion-icon name="call"></ion-icon>
          </div>
          <span>เบอร์โทรศัพท์</span>
        </div>
        <div class="info-value">
          {{ user.phone || '-' }}
        </div>
      </div>

      <div class="divider"></div>

      <div class="info-group">
        <div class="info-label">
          <div class="icon-box">
            <ion-icon name="shield-checkmark"></ion-icon>
          </div>
          <span>สถานะบัญชี</span>
        </div>
        <div class="info-value status-active">
          <span *ngIf="user.status === 0 || user.status === 'active'" style="color: green;">ปกติ</span>
          <span *ngIf="user.status !== 0 && user.status !== 'active'" style="color: red;">ถูกระงับ</span>
        </div>
      </div>

    </div>
  </div>

</ion-content>
