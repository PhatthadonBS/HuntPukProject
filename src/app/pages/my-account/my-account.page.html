<ion-header class="ion-no-border">
  <ion-toolbar class="custom-toolbar">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon name="arrow-back"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>บัญชีของฉัน</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  
  <div class="profile-header-bg">
    <div class="avatar-wrapper">
      <div class="avatar-circle">
        <ion-icon name="person"></ion-icon> 
      </div>
      <div class="user-name-display">
        <h2>{{ user.username || user.USERNAME || 'Guest' }}</h2>
        <p>สมาชิกทั่วไป</p>
      </div>
    </div>
  </div>

  <div class="profile-content-card">
    
    <div class="edit-btn-wrapper">
      <ion-button class="btn-edit-custom" expand="block" shape="round" (click)="goToEditProfile()">
        <ion-icon name="create" slot="start"></ion-icon>
        แก้ไขข้อมูลส่วนตัว
      </ion-button>
    </div>

    <div class="info-group">
      <div class="info-label">
        <div class="icon-box">
          <ion-icon name="person"></ion-icon>
        </div>
        <span>ชื่อผู้ใช้งาน</span>
      </div>
      <div class="info-value">
        {{ user.username || user.USERNAME || '-' }}
      </div>
    </div>

    <div class="divider"></div>

    <div class="info-group">
      <div class="info-label">
        <div class="icon-box">
          <ion-icon name="mail"></ion-icon>
        </div>
        <span>อีเมล</span>
      </div>
      <div class="info-value">
        {{ user.email || user.EMAIL || '-' }}
      </div>
    </div>

    <div class="divider"></div>

    <div class="info-group">
      <div class="info-label">
        <div class="icon-box">
          <ion-icon name="call"></ion-icon>
        </div>
        <span>เบอร์โทรศัพท์</span>
      </div>
      <div class="info-value">
        {{ user.phone_number || user.PHONE_NUMBER || '-' }}
      </div>
    </div>

    <div class="divider"></div>

    <div class="info-group">
      <div class="info-label">
        <div class="icon-box">
          <ion-icon name="shield-checkmark"></ion-icon>
        </div>
        <span>สถานะบัญชี</span>
      </div>
      <div class="info-value status-active">
        <span *ngIf="user.accout_status === 0">ปกติ</span>
        <span *ngIf="user.accout_status !== 0" style="color: red;">ถูกระงับ</span>
      </div>
    </div>

  </div>

</ion-content>
