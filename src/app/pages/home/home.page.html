<ion-content [fullscreen]="true">
  
  <div class="map-wrapper">
    <google-map 
      *ngIf="apiLoaded | async"
      height="100%" 
      width="100%" 
      [center]="center" 
      [zoom]="zoom"
      [options]="mapOptions">

      <map-marker 
        *ngFor="let dorm of dorms"
        [position]="{ lat: dorm.lat, lng: dorm.lng }"
        [title]="dorm.DORM_NAME"
        (mapClick)="openInfoWindow(marker, dorm)"
        #marker="mapMarker">
      </map-marker>

      <map-info-window>
        <div *ngIf="selectedDorm" style="text-align: center; color: black; padding: 5px;">
          <h3 style="margin: 0; font-size: 16px;">{{ selectedDorm?.DORM_NAME }}</h3>
          <p style="margin: 5px 0;">เริ่ม {{ selectedDorm?.start_price }} บาท</p>
          <button (click)="goToDetail()" style="background: #3880ff; color: white; border: none; padding: 5px 10px; border-radius: 4px;">
            ดูรายละเอียด
          </button>
        </div>
      </map-info-window>

    </google-map>

    <div *ngIf="(apiLoaded | async) === false" style="display:flex; justify-content:center; align-items:center; height:100%; color:black;">
        กำลังโหลดแผนที่...
    </div>
  </div>

  <div class="search-overlay ion-padding-top">
    <div class="search-row">
      <div class="search-input-box">
        <ion-icon name="search" size="large"></ion-icon>
        <input type="text" placeholder="ค้นหารายชื่อหอพัก" [(ngModel)]="searchText" (keyup.enter)="onSearch()">
      </div>
      <button class="btn-search" (click)="onSearch()">ค้นหา</button>
    </div>
    
    <div class="filter-row">
      <div class="chip-button" (click)="openFilter()">
        กรอง <ion-icon name="funnel-outline"></ion-icon>
      </div>
      <div class="chip-button" (click)="goToCompare()">
        เปรียบเทียบ <ion-icon name="layers-outline"></ion-icon>
      </div>
    </div>
  </div>

</ion-content>

<ion-footer class="custom-tab-bar">
<div class="tab-item active">
  <div class="circle-bg">
    <img src="assets/logo.png" class="logo-icon">
  </div>
  <span>หน้าหลัก</span>
</div>

  <div class="tab-item">
    <ion-icon name="list-outline" size="large"></ion-icon>
    <span>รายการ</span>
  </div>

  <div class="tab-item link-text" (click)="goToLogin()">
    <ion-icon name="person-circle-outline" size="large"></ion-icon>
    <span>เข้าสู่ระบบ</span>
  </div>
</ion-footer>
