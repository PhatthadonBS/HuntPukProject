<div class="ion-page">
  
  <app-header 
    title="หน้าหลัก" 
    [userData]="currentUser" 
    (searchChange)="onSearch($event)">
  </app-header>

  <ion-content [fullscreen]="true" [scrollY]="false">
    
    <div class="map-wrapper">
      <google-map 
        *ngIf="apiLoaded | async"
        height="100%" 
        width="100%" 
        [center]="center" 
        [zoom]="zoom"
        [options]="mapOptions">
        
        <map-marker 
          *ngFor="let dorm of dorms"
          [position]="{ lat: dorm.lat, lng: dorm.lng }"
          [title]="dorm.DORM_NAME"
          (mapClick)="openInfoWindow(marker, dorm)"
          #marker="mapMarker">
        </map-marker>

        <map-info-window>
          <div *ngIf="selectedDorm" style="text-align: center; color: black; padding: 5px; min-width: 150px;">
            <h3 style="margin: 0; font-size: 16px; font-weight: bold;">{{ selectedDorm?.DORM_NAME }}</h3>
            
            <p style="margin: 5px 0; font-size: 14px; color: #555;">
              เริ่ม <span style="color: #d32f2f; font-weight: bold;">{{ selectedDorm?.start_price | number }}</span> บาท
            </p>
            
            <button (click)="goToDetail()" style="background: #3880ff; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-top: 5px;">
              ดูรายละเอียด
            </button>
          </div>
        </map-info-window>
      </google-map>
    </div>

    <div slot="fixed" class="ui-overlay">
      <div class="top-left-buttons">
        <div class="chip-button" (click)="openFilter()">
          กรอง <ion-icon name="caret-down-outline"></ion-icon>
        </div>
        <div class="chip-button" (click)="goToCompare()">
          เปรียบเทียบ <ion-icon name="layers-outline"></ion-icon>
        </div>
      </div>

      <div class="menu-toggle-btn" (click)="toggleMenu()">
        <ion-icon name="menu-outline" style="font-size: 24px; color: white;"></ion-icon>
      </div>
    </div>

    <div class="dorm-side-panel" *ngIf="selectedDormDetail">
      
      <div class="btn-close-panel" (click)="closeDetailPanel()">
        <ion-icon name="close"></ion-icon>
      </div>

      <app-dorm-detail 
        [dormData]="selectedDormDetail" 
        [isPopup]="true"
        style="height: 100%; display: block;">
      </app-dorm-detail>

    </div>

    <ion-modal [isOpen]="isModalOpen" (didDismiss)="setOpen(false)" class="filter-modal-custom">
      <ng-template>
        <div class="filter-wrapper">
          
          <div class="filter-head">
            <h2>ตัวกรองค้นหา</h2>
            <ion-icon name="close" (click)="setOpen(false)" size="large"></ion-icon>
          </div>

          <div class="price-section">
            <h3>ช่วงราคา</h3>
            <div class="price-inputs">
              <div class="price-col">
                <span class="label">ต่ำสุด</span>
                <div class="input-capsule">
                  <input type="number" [(ngModel)]="minPrice" placeholder="0">
                </div>
              </div>
              <div class="dash">-</div>
              <div class="price-col">
                <span class="label">สูงสุด</span>
                <div class="input-capsule">
                  <input type="number" [(ngModel)]="maxPrice" placeholder="ไม่จำกัด">
                </div>
              </div>
            </div>
          </div>

          <div class="zone-section">
            <h3>บริเวณหอพัก</h3>
            <div class="zone-options">
               
               <div 
                 class="zone-item" 
                 *ngFor="let zone of zoneOptions"
                 [class.selected]="selectedZone === zone.ZONE_NAME" 
                 (click)="selectZone(zone.ZONE_NAME)">
                 
                 <span>{{ zone.ZONE_NAME }}</span>
                 
                 <ion-icon *ngIf="selectedZone === zone.ZONE_NAME" name="checkmark-circle" color="primary"></ion-icon>
                 <ion-icon *ngIf="selectedZone !== zone.ZONE_NAME" name="chevron-down-circle-outline" style="opacity: 0.3;"></ion-icon>
               
               </div>

               <div *ngIf="zoneOptions.length === 0" style="width: 100%; text-align: center; color: #999; padding: 10px;">
                 กำลังโหลดข้อมูลโซน...
               </div>

            </div>
          </div>

          <div class="action-section">
            <button class="btn-confirm" (click)="applyFilter()">ยืนยันการค้นหา</button>
            <button class="btn-clear" (click)="minPrice=null; maxPrice=null; selectedZone=''; applyFilter()">ล้างตัวกรอง</button>
          </div>

        </div>
      </ng-template>
    </ion-modal>

  </ion-content>
</div>
