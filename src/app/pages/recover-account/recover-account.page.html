<ion-content [fullscreen]="true">
  
  <div class="recover-container">
    
    <div class="back-button" (click)="goBack()">
      <ion-icon name="arrow-back"></ion-icon>
      <span>กลับ</span>
    </div>

    <div class="header-text">
      <h1>กู้คืนบัญชี</h1>
      <p>หากบัญชีของคุณถูกระงับ<br>กรอกอีเมลเพื่อยืนยันตัวตนและเปิดใช้งาน</p>
    </div>

    <div class="form-card fade-in">
      
      <div class="custom-input">
        <input type="email" placeholder="อีเมลของคุณ" [(ngModel)]="email">
        <ion-icon name="mail" color="medium"></ion-icon>
      </div>

      <ion-button expand="block" shape="round" class="btn-action" (click)="requestRecovery()">
        ตรวจสอบและกู้คืน <ion-icon name="arrow-forward" slot="end"></ion-icon>
      </ion-button>

    </div>

  </div>

</ion-content>
