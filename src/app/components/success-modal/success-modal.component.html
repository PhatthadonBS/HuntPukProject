<div class="success-overlay" *ngIf="isVisible" (click)="onOverlayClick($event)">
  <div class="success-card" [@popIn]>

    <div class="icon-circle">
      <ion-icon name="time-outline"></ion-icon>
    </div>

    <h2 class="success-title">ส่งข้อมูลสำเร็จ!</h2>

    <p class="success-status">กำลังรอการอนุมัติ</p>

    <p class="success-detail">
      ระบบได้รับข้อมูลหอพักของคุณแล้ว<br>
      กรุณารอผู้ดูแลระบบตรวจสอบภายใน 24 ชั่วโมง
    </p>

    <button class="btn-confirm" (click)="confirm()">
      <span>ตกลงรับทราบ</span>
      <ion-icon name="checkmark-circle"></ion-icon>
    </button>

  </div>
</div>
