<ion-header class="ion-no-border" style="position: relative; z-index: 5000 !important;">
  <ion-toolbar class="custom-toolbar">
    
    <div class="main-header-container">
      
      <div class="logo-section">
        <img src="assets/logo1.jpg" class="header-logo" alt="Logo" onerror="this.src='https://placehold.co/40x40'">
        <span class="header-title">HuntPuk</span>
      </div>

      <!-- Search Section with Autocomplete -->
      <div class="search-section">
        <div class="search-wrap">
          <div class="search-box">
            <input 
              type="text" 
              id="main-search-input"
              placeholder="ค้นหาหอพัก..." 
              [(ngModel)]="searchText" 
              (input)="onInput()"
              (keyup.enter)="onSearchSubmit()"
              autocomplete="off"
            >
            <button class="clear-btn" *ngIf="searchText" (click)="clearSearch()">
              <ion-icon name="close-circle"></ion-icon>
            </button>
          </div>
          <button class="btn-search-action" (click)="onSearchSubmit()">
            <span>ค้นหา</span> <ion-icon name="search"></ion-icon>
          </button>

          <!-- Autocomplete Dropdown -->
          <div class="suggestions-dropdown" *ngIf="showSuggestions">
            <div class="suggestion-item" 
                 *ngFor="let dorm of suggestions"
                 (click)="selectSuggestion(dorm)">
              <ion-icon name="location-outline" class="sug-icon"></ion-icon>
              <div class="sug-text">
                <span class="sug-name">{{ dorm.DORM_NAME }}</span>
                <span class="sug-zone">{{ dorm.ZONE_NAME || dorm.zone || 'ไม่ระบุโซน' }}</span>
              </div>
              <ion-icon name="chevron-forward-outline" class="sug-arrow"></ion-icon>
            </div>
          </div>
        </div>
      </div>

      <div class="auth-buttons">
        <ng-container *ngIf="!userData">
          <button class="btn-register" (click)="goToRegister()">สมัคร</button>
          <button class="btn-login" (click)="goToLogin()">เข้าสู่ระบบ</button>
        </ng-container>

        <ng-container *ngIf="userData">
          <div class="user-badge" (click)="goToMyAccount()">
            <ion-icon name="person-circle"></ion-icon>
            <span>{{ userData.username || userData.USERNAME }}</span>
          </div>
          <div class="logout-btn" (click)="logout()">
            <ion-icon name="log-out-outline"></ion-icon>
          </div>
        </ng-container>
      </div>
      
    </div>

  </ion-toolbar>
</ion-header>
